[package]
name = "forge-lsp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Cairn: a Language Server Protocol client (Flymake diagnostics, xref, eldoc, rename, code actions, formatting, completion, hierarchies)"

[package.metadata.forge]
name = "lsp"

[[package.metadata.forge.commands]]
name = "cairn-doctor"
summary = "Check that the language servers Cairn may start are installed."

[[package.metadata.forge.commands]]
name = "cairn-progress-closed"
summary = "Forget a progress overlay that Forge closed."

[[package.metadata.forge.commands]]
name = "cairn-clear-messages"
summary = "Dismiss the server messages."

# The progress panel that follows the servers' work-done reports.
[[package.metadata.forge.overlay-kinds]]
id = "progress"
handler = "cairn-progress-closed"
placement = "bottom"
height = 4
title = "Cairn"

# Server notifications, newest first, until dismissed.
[[package.metadata.forge.overlay-kinds]]
id = "messages"
handler = "cairn-clear-messages"
placement = "top"
height = 6
width = 70
title = "Cairn messages"

# The host removes this plugin's overlays when it unloads; forget the id
# when the user closes one with C-g or overlay-close.
[[package.metadata.forge.hooks]]
id = "progress-closed"
event = "overlay.closed"
handler = "cairn-progress-closed"
payload-version = 1

[[package.metadata.forge.hooks]]
id = "messages-closed"
event = "overlay.closed"
handler = "cairn-clear-messages"
payload-version = 1

[[package.metadata.forge.doctor-checks]]
id = "servers"
handler = "cairn-doctor"
label = "Language servers"
description = "The server programs Cairn's modes try are on PATH."
severity = "warning"

[package.metadata.forge.permissions]
# The language servers it may start (config.rs's defaults; programs named
# in cairn.json need adding here too). Remove the ones you do not want.
environment = true
processes = [
    "pyright-langserver",
    "pylsp",
    "basedpyright-langserver",
    "jedi-language-server",
    "ruff",
    "rust-analyzer",
    "clangd",
    "ccls",
    "gopls",
    "typescript-language-server",
    "deno",
    "bash-language-server",
    "lua-language-server",
    "vscode-json-language-server",
    "vscode-json-languageserver",
    "taplo",
]

# Standalone: not part of the main workspace build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
forge-plugin-sdk = { git = "https://github.com/martial-plains/forge" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
